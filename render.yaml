services:
  - type: web
    name: assistant-juridique-mali-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: UPLOAD_DIR
        value: uploads
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "True"
      - key: ADMIN_NOTIFICATION_EMAIL
        value: fayesidi86@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
